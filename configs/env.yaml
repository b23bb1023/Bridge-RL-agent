# Environment configuration for the 10-bridge inspection & maintenance POMDP.
# Monetary values are in US dollars. The reward is the negative monthly cost divided by `reward_scale`.

horizon_months: 120          # 10-year planning horizon, one decision per month
network_file: data/processed/network_10.csv

deterioration:
  # Monthly probability of dropping one condition state, for states 0..3 (state 4 is absorbing).
  # These are the defaults; when `fit_file` exists, its fitted values replace them.
  base_monthly_drop: [0.0088, 0.0052, 0.0125, 0.0184]
  age_coef: 0.35             # log-hazard change per `age_ref_years` of extra age
  adt_coef: 0.25             # log-hazard change between a 1-vehicle and a 100k-vehicle bridge
  age_ref_years: 50
  max_monthly_drop: 0.5
  fit_file: data/processed/transition_fit.json
  # Inventory ratings change slowly partly because agencies keep doing routine upkeep that the
  # inventory does not record. In the simulator the network gets no upkeep beyond the agent's own
  # work orders, so fitted hazards are multiplied by this factor (assumption; tested at 1.5 and 5).
  unmaintained_factor: 3.0

closure:
  monthly_prob: 0.25         # chance an open Critical (state 4) bridge is closed in a given month

repair:
  minor_success: 0.90        # minor repair: state 1 -> 0 or 2 -> 1; no effect on states 0, 3, 4
  major_success: 0.95        # major repair: any state -> 0 (otherwise -> 1); reopens a closed bridge

inspection:
  routine_interval_months: 24
  routine_sigma: 0.65        # routine visual inspection, free, runs on its own schedule (replaced by the fitted value)
  indepth_sigma: 0.25        # discretionary in-depth inspection chosen by the agent (sharper than routine)

costs:
  inspection_per_m2: 16.0
  minor_per_m2: 160.0
  major_per_m2: 1600.0
  car_cost_per_km: 0.35      # vehicle operating + time cost of detoured traffic
  truck_cost_per_km: 1.00
  min_detour_km: 2.0
  max_detour_km: 60.0
  risk_scores: [0.0, 0.05, 0.20, 0.60, 1.00]
  risk_rate: 0.025           # monthly expected-loss rate at risk score 1, applied to (major cost + one month of closure)
  reward_scale: 1.0e6

budget:
  # Maintenance funding accrues into an account every month and unspent money rolls over, so the
  # agent can save up for an expensive major repair. Actions costing more than the balance are masked.
  annual: null               # yearly funding; filled in by scripts/calibrate.py; null means unconstrained
  initial_years: 1.0         # opening balance, in years of funding
  cap_years: null            # optional ceiling on the balance, in years of funding
  fraction_of_need: 0.5      # funding = fraction x the sufficiency level F* found by scripts/calibrate.py

initial_state:
  # Population share of each condition state, combined with each bridge's last recorded rating.
  # Replaced by the inventory's observed rating distribution when `fit_file` exists.
  prior: [0.10, 0.50, 0.28, 0.10, 0.02]
  # Training-time diversity: with this probability each bridge's recorded rating state is moved by
  # one (up or down) and its months-since-inspection redrawn. Evaluation always uses 0.
  perturb_prob: 0.0

agent_interface:
  obs_mode: belief           # belief | oracle | last_obs
  allow_inspection: true     # false gives the no-discretionary-inspection ablation
  domain_masks: false        # optional extra masks (no re-inspection within 6 months, no major repair on good bridges)
  invalid_action_penalty: 1.0e6   # cost charged (and action replaced by defer) if an infeasible action is sent

training_reward:
  # "expected": the risk and end-of-horizon terms of the reward use their expectation under the
  # agent's (exact) belief instead of the realised hidden state. Same expected return for every
  # policy, lower variance. Episode statistics always record the realised true cost.
  risk_and_salvage: expected   # realized | expected

shaping:                     # potential-based shaping on the expected monthly risk of the belief
  enabled: false
  eta: 1.0
  gamma: 0.99                # must match the agent's discount factor

stress:
  physics_decay_scale: 1.0   # multiplies true deterioration hazards
  filter_decay_scale: 1.0    # multiplies the hazards the belief filter assumes
  budget_scale: 1.0
