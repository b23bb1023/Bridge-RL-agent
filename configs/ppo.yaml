# Maskable PPO comparison agent (same environment, observation and validation protocol as DQN).

ppo:
  total_steps: 1000000
  n_envs: 8
  eval_every: 25000
  n_steps: 512            # per environment, so 4096 transitions per update
  batch_size: 256
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
