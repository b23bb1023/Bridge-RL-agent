# DQN agent: settings of the main agent, and the experiment variants that change them.

agent:
  arch: decomposed          # per-bridge value decomposition with a learned price of money
  hidden: 256
  dueling: true
  double: true
  masked: true
  gamma: 0.99
  n_step: 3
  lr: 2.5e-4
  batch_size: 128
  buffer_size: 1000000      # keeps every transition, so rare closures are not forgotten
  learning_starts: 10000
  train_every: 4            # environment steps per gradient update
  n_envs: 8                 # environments stepped together when collecting experience
  tau: 0.005                # soft target-network update after every gradient step
  eps_start: 0.3
  eps_end: 0.05
  eps_fraction: 0.2
  explore_defer_prob: 0.5   # half of the exploratory actions defer, so exploration does not drain the account
  demo_policy: planner      # warm start from recorded episodes of the lookahead planner (scripts/make_demos.py)
  demo_episodes: 100
  demo_pretrain_updates: 20000
  demo_ratio: 0.25          # share of each batch drawn from the demonstrations
  margin: 0.5               # large-margin term on demonstrated transitions only
  margin_weight: 1.0
  margin_decay_steps: 300000  # the margin fades to zero over training
  max_grad_norm: 10.0
  huber_delta: 1.0
  total_steps: 300000
  eval_every: 20000

variants:
  main: {}
  no_demos:          # same agent learned from scratch
    agent: {demo_policy: "", eps_start: 1.0, eps_fraction: 0.3}
  pretrain_only:     # only the offline phase (TD + margin on the planner demonstrations), no online learning
    agent: {total_steps: 8, eval_every: 8}
  rule_demos:        # warm start from the best tuned rule instead of the planner
    agent: {demo_policy: best, demo_episodes: 200}
  shared:            # shared-bridge dueling network without the per-bridge decomposition
    agent: {arch: shared}
  flat:              # plain MLP over the whole observation
    agent: {arch: flat}
  vanilla:           # textbook DQN: flat MLP, 1-step targets, no masks, dueling, double estimator or demonstrations
    agent: {arch: flat, dueling: false, double: false, masked: false, demo_policy: "", n_step: 1, eps_start: 1.0,
            eps_fraction: 0.3, explore_defer_prob: 0.0, gamma: 0.99, tau: 1.0, target_update: 2000}
  oracle:            # sees the true condition (demonstrations from a planner that also sees it)
    env: {agent_interface: {obs_mode: oracle}}
  last_obs:          # sees only the last inspection result instead of the Bayesian belief
    env: {agent_interface: {obs_mode: last_obs}}
  no_inspection:     # cannot buy inspections (routine inspections still happen)
    env: {agent_interface: {allow_inspection: false}}
